[project]
name = "openplc-engineering-mcp"
version = "0.1.0"
description = "Domain-oriented MCP server for OpenPLC engineering operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.1.1,<3",
]

[project.scripts]
openplc-engineering-mcp = "openplc_engineering_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]
