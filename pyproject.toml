[project]
name = "openplc-engineering-mcp"
version = "0.1.0"
description = "Domain-oriented MCP server for OpenPLC engineering operations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2.1.1,<3",
]

[project.scripts]
openplc-engineering-mcp = "openplc_engineering_mcp.server:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp[cli]>=2.1.1,<3",
    "pytest>=8.4,<9",
    "pyright>=1.1.380,<2",
    "ruff>=0.7,<1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pyright]
pythonVersion = "3.12"
reportMissingImports = true
venvPath = "."
venv = ".venv"
