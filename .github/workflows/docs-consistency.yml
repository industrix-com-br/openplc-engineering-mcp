name: Docs Consistency

on:
  pull_request:
    paths:
      - "src/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check documentation impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt

          if ! grep -q '^docs/' changed-files.txt; then
            echo "::warning title=Documentation impact::Source files changed but no files under docs/ were modified. Confirm the PR Documentation section is accurate."
            echo "### Documentation impact" >> "$GITHUB_STEP_SUMMARY"
            echo "Source files changed, but no files under \`docs/\` were modified. Confirm the PR Documentation section is accurate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Documentation changes detected."
          fi
